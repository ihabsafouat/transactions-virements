image: golang:1.21

stages:
  - build
  - verify

before_script:
  - pwd
  - ls -la
  - test -f go.mod || (echo "❌ go.mod not found" && exit 1)

# --------------------------
# Job de build
# --------------------------
build:
  stage: build
  script:
    - go version
    - go mod tidy
    - go build -v ./...
  artifacts:
    paths:
      - go.sum
  only:
    - merge_requests
    - main

# --------------------------
# Tests unitaires + couverture
# --------------------------
unit_tests:
  stage: verify
  script:
    - go test ./... -coverprofile=coverage.out
    - go test -v ./... -json > report.json
    - go install github.com/jstemmer/go-junit-report@latest
    - go-junit-report < report.json > junit-report.xml
  artifacts:
# --------------------------
# Linting
  image: golangci/golangci-lint:latest
  stage: verify
  artifacts:
    when: always
    paths:
      - lint-report.json
  needs:
    - build
  only:
    - main
    - merge_requests
  script:
    - golangci-lint run --out-format json ./... > lint-report.json || true
golangci_lint:
# --------------------------
    - main

    - merge_requests
  only:
    when: always
  needs:
    - build
      - junit-report.xml
    reports:
      - coverage.out
      junit: junit-report.xml
